version: '3.8'

services:
  backend:
    build: ./backend
    container_name: advocai_backend
    command: daphne -b 0.0.0.0 -p 8000 legal_doc_generator.asgi:application
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis

  frontend:
    build: ./frontend
    container_name: advocai_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  redis:
    image: redis:alpine
    container_name: advocai_redis
    ports:
      - "6379:6379"
